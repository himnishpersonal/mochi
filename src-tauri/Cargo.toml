[package]
name = "mochi"
version = "0.7.0"
description = "MOCHI — My Offline Conversation Hub & Intelligence"
authors = ["MOCHI contributors"]
edition = "2021"

[features]
default = []
native-system-audio = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
whisper-rs = "0.16"
symphonia = { version = "0.5.4", features = ["all"] }
futures-util = "0.3"
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time", "net", "sync", "rt"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["rt"] }
subtle = "2.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
tauri-nspanel = "=2.1.1"

[dev-dependencies]
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
